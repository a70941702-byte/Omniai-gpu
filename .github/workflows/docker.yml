name: Build GPU Docker Image
on:
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Unzip template (لو رفعت ZIP)
        run: |
          if [ -f omniai-gpu-template.zip ]; then
            unzip -o omniai-gpu-template.zip && rm omniai-gpu-template.zip
          fi

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.actor }}/omniai-gpu:latest
